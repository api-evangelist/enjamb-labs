name: Enjamb Labs
description: >-
  Enjamb Labs builds an AI-agent platform for pharmaceutical drug development. Its
  browser-based "integrated research environment" runs specialized agents across the
  full R&D lifecycle -- clinical evidence synthesis, trial design and statistical
  programming, and regulatory submission preparation -- while connecting to the systems
  pharma teams already use (Benchling, Veeva, Medidata, SAS) so no data migration is
  required. The workspace bundles Word/Excel/PowerPoint editors, Python and R compute
  environments, and 100+ scientific integrations, and emphasizes auditability,
  traceability, and human review, keeping each output attached to its sources, files,
  code, and decisions. Backed by Y Combinator and Founders, Inc., Enjamb reports early
  usage across major pharmaceutical companies including Johnson & Johnson, Merck,
  AbbVie, Bristol Myers Squibb, and Sanofi.
